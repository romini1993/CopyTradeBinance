<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fast Trading Log - Porto Style</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: #090a10;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        * { box-sizing: border-box; }
        input, select, textarea, button { font-size: 15px !important; font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #23273c; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #6366f1; }

        @media (max-width: 1023px) {
            #dailySummaryList {
                max-height: 380px;
                overflow-y: auto;
            }
        }

        .porto-card {
            background: #10121d;
            border: 1px solid #1e2235;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .porto-input {
            background: #090a10;
            border: 1px solid #23273c;
            color: #f1f5f9;
        }
        .porto-input:focus {
            border-color: #6366f1;
            outline: none;
        }

        .flatpickr-calendar { background: #10121d !important; box-shadow: 0 10px 30px rgba(0,0,0,.6) !important; border: 1px solid #23273c !important; }
        .flatpickr-day.selected { background: #6366f1 !important; border-color: #6366f1 !important; color: #ffffff !important; }
        .flatpickr-day.today { border-color: #6366f1 !important; }
        
        @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .rise-in { animation: riseIn .3s ease-out both; }

        #toast {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
            opacity: 0;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body class="p-3 md:p-6 flex justify-center">

    <div class="w-full max-w-[1600px] grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        <div class="lg:col-span-4 xl:col-span-4 space-y-5 lg:sticky lg:top-6">
            <div class="porto-card px-4 py-3 rounded-xl flex items-center justify-between border-l-4 border-l-indigo-500">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-display text-base font-bold">
                        ⚡
                    </div>
                    <div>
                        <h1 class="font-display text-base font-bold tracking-tight text-white leading-none">TRADING LOG</h1>
                        <p class="text-[10px] text-slate-400 mt-0.5">Jurnal Presisi & Rekap Otomatis</p>
                    </div>
                </div>
            </div>

            <div id="statsBar" class="grid grid-cols-3 gap-2.5">
                <div class="porto-card p-3 rounded-xl text-center flex flex-col justify-center">
                    <div class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 mb-0.5">Total PNL</div>
                    <div id="statTotal" class="num text-sm font-bold text-slate-200">–</div>
                    <div id="statTotalIdr" class="text-[10px] text-slate-400 font-medium num mt-0.5">–</div>
                </div>
                <div class="porto-card p-3 rounded-xl text-center flex flex-col justify-center">
                    <div class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 mb-0.5">Trades</div>
                    <div id="statCount" class="num text-sm font-bold text-slate-200">–</div>
                </div>
                <div class="porto-card p-3 rounded-xl text-center flex flex-col justify-center">
                    <div class="text-[10px] uppercase font-semibold tracking-wider text-slate-400 mb-0.5">Win Rate</div>
                    <div id="statWinRate" class="num text-sm font-bold text-slate-200">–</div>
                </div>
            </div>

            <form id="tradeForm" onsubmit="handleSubmit(event)" class="porto-card p-5 rounded-2xl space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400">Input Position</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Pair / Koin</label>
                    <input type="text" id="pair" list="pairList" required placeholder="Contoh: BTCUSDT" onblur="formatPairInput(this)" class="w-full porto-input rounded-xl px-3.5 py-2.5 uppercase font-medium">
                    <datalist id="pairList">
                        <option value="BTCUSDT"><option value="ETHUSDT"><option value="SOLUSDT"><option value="XRPUSDT">
                    </datalist>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Opened Date</label>
                        <input type="text" id="opened" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">Closed Date</label>
                        <input type="text" id="closed" required placeholder="dd/mm/yyyy" class="w-full porto-input rounded-xl px-3.5 py-2.5">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1.5">Closing PNL (USDT)</label>
                    <input type="number" step="any" id="pnl" required placeholder="0.00" class="w-full porto-input rounded-xl px-3.5 py-2.5 num font-medium">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/20">
                    Simpan Position
                </button>
            </form>
        </div>

        <div class="lg:col-span-4 xl:col-span-4 space-y-4 lg:sticky lg:top-6">
            <div class="porto-card p-4 sm:p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400">Rekap Harian</h2>
                    <span class="text-[10px] text-slate-400">Klik tanggal untuk filter</span>
                </div>
                <div id="dailySummaryList" class="space-y-2 lg:max-h-[calc(100vh-140px)] overflow-y-auto pr-1 custom-scroll"></div>
            </div>
        </div>

        <div class="lg:col-span-4 xl:col-span-4 space-y-4 lg:sticky lg:top-6">
            <div class="porto-card p-4 sm:p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center mb-1">
                    <h2 id="listHeaderTitle" class="text-xs font-bold uppercase tracking-wider text-indigo-400">Riwayat Trade</h2>
                    <button id="resetFilterBtn" onclick="filterByDate(null)" class="text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded hidden border border-slate-700">
                        🔄 Semua Tanggal
                    </button>
                </div>
                <div id="tradeList" class="space-y-2 max-h-[calc(100vh-140px)] overflow-y-auto pr-1 custom-scroll"></div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="porto-card w-full max-w-sm p-6 rounded-2xl border border-rose-500/30 text-center space-y-4">
            <div class="w-12 h-12 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center text-xl font-bold mx-auto">⚠️</div>
            <h3 class="font-bold text-white text-base">Hapus Trade</h3>
            <p id="deleteModalText" class="text-xs text-slate-400">Yakin mau hapus?</p>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeDeleteModal()" class="w-1/2 bg-[#1e2235] text-slate-300 py-2.5 rounded-xl text-xs">Batal</button>
                <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-rose-600 text-white py-2.5 rounded-xl text-xs">Hapus</button>
            </div>
        </div>
    </div>

    <div id="toast" class="px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2">
        <span id="toastIcon"></span><span id="toastText"></span>
    </div>

    <script>
        // MASUKKAN LINK URL DEPLOYMENT APPS SCRIPT BARU DI SINI:
        const API_URL = "https://script.google.com/macros/s/AKfycbz40OxyG_66G1zwBw9HwQ28GQOXvAA_Yi1LMRp8ekHPxn5UvAtzaUFoCLU8N_6Bm0cq/exec";
        
        let currentKursIdr = 17550;
        let selectedNoToDelete = null;
        let selectedFilterDate = null;
        let cachedGlobalResponse = { history: [], totalPnl: 0, totalTrades: 0, winRate: 0 };

        fetch("https://api.binance.com/api/v3/ticker/price?symbol=USDTIDR")
            .then(res => res.json())
            .then(data => { if (data && data.price) currentKursIdr = parseFloat(data.price); }).catch(e=>{});

        const closedPicker = flatpickr("#closed", { dateFormat: "Y-m-d", altInput: true, altFormat: "d/m/Y", defaultDate: "today", disableMobile: true });
        const openedPicker = flatpickr("#opened", { dateFormat: "Y-m-d", altInput: true, altFormat: "d/m/Y", defaultDate: "today", disableMobile: true });

        function formatPairInput(input) {
            let val = input.value.trim().toUpperCase();
            if (val && !val.includes("USDT")) input.value = val + "USDT";
            else input.value = val;
        }

        function showToast(msg, type='success') {
            const t = document.getElementById('toast'), i = document.getElementById('toastIcon'), txt = document.getElementById('toastText');
            txt.innerText = msg; i.innerText = type === 'success' ? '✓' : '✕';
            t.className = `px-5 py-3 rounded-2xl text-xs font-semibold shadow-2xl backdrop-blur-md border flex items-center gap-2 ${type==='success'?'bg-emerald-500/20 border-emerald-500/40 text-emerald-300':'bg-rose-500/20 border-rose-500/40 text-rose-300'} show`;
            setTimeout(() => t.classList.remove('show'), 1800);
        }

        window.onload = function() {
            const cached = localStorage.getItem('tradingDataCache');
            if (cached) {
                try { cachedGlobalResponse = JSON.parse(cached); renderDashboard(cachedGlobalResponse); } catch(e){}
            }
            fetch(API_URL).then(res => res.json()).then(data => {
                if (data && data.history) {
                    cachedGlobalResponse = data;
                    localStorage.setItem('tradingDataCache', JSON.stringify(data));
                    renderDashboard(data);
                }
            }).catch(e=>{});
        };

        function filterByDate(d) { selectedFilterDate = d; renderDashboard(cachedGlobalResponse); }
        function formatRupiah(val) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val); }

        function handleSubmit(e) {
            e.preventDefault();
            const pairField = document.getElementById('pair');
            formatPairInput(pairField);
            const pair = pairField.value;
            const opened = document.getElementById('opened').value;
            const closed = document.getElementById('closed').value;
            const pnl = parseFloat(document.getElementById('pnl').value) || 0;

            const maxNo = cachedGlobalResponse.history.length > 0 ? Math.max(...cachedGlobalResponse.history.map(x => parseInt(x.no) || 0)) : 0;
            const newItem = { no: maxNo + 1, pair, opened, closed, pnl };

            cachedGlobalResponse.history.unshift(newItem);
            recalculateStats();

            localStorage.setItem('tradingDataCache', JSON.stringify(cachedGlobalResponse));
            renderDashboard(cachedGlobalResponse);
            showToast("Tersimpan", "success");

            document.getElementById('pair').value = '';
            document.getElementById('pnl').value = '';

            fetch(`${API_URL}?action=add&pair=${encodeURIComponent(pair)}&opened=${encodeURIComponent(opened)}&closed=${encodeURIComponent(closed)}&pnl=${pnl}`).catch(e=>{});
        }

        function handleHapus(no) {
            selectedNoToDelete = no;
            document.getElementById('deleteModalText').innerText = "Yakin mau hapus trade No #" + no + "?";
            document.getElementById('deleteModal').classList.remove('hidden');
        }
        function closeDeleteModal() { selectedNoToDelete = null; document.getElementById('deleteModal').classList.add('hidden'); }

        document.getElementById('confirmDeleteBtn').onclick = function() {
            if (selectedNoToDelete === null) return;
            const no = selectedNoToDelete;
            closeDeleteModal();
            cachedGlobalResponse.history = cachedGlobalResponse.history.filter(item => parseInt(item.no) !== parseInt(no));
            recalculateStats();

            localStorage.setItem('tradingDataCache', JSON.stringify(cachedGlobalResponse));
            renderDashboard(cachedGlobalResponse);
            showToast("Terhapus", "error");

            fetch(`${API_URL}?action=delete&no=${no}`).catch(e=>{});
        };

        function recalculateStats() {
            let sum = 0, wins = 0;
            cachedGlobalResponse.history.forEach(item => {
                const p = parseFloat(item.pnl) || 0;
                sum += p;
                if (p > 0) wins++;
            });
            cachedGlobalResponse.totalPnl = sum;
            cachedGlobalResponse.totalTrades = cachedGlobalResponse.history.length;
            cachedGlobalResponse.winRate = cachedGlobalResponse.totalTrades > 0 ? Math.round((wins / cachedGlobalResponse.totalTrades) * 100) : 0;
        }

        function renderDashboard(res) {
            const tradeC = document.getElementById('tradeList');
            const dailyC = document.getElementById('dailySummaryList');
            tradeC.innerHTML = ''; dailyC.innerHTML = '';
            renderStats(res);

            const data = res.history || [];
            if (data.length === 0) {
                tradeC.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Belum ada data.</p>';
                dailyC.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Belum ada rekap.</p>';
                return;
            }

            const dailyMap = {};
            data.forEach(item => {
                if (!item.closed) return;
                if (!dailyMap[item.closed]) dailyMap[item.closed] = { total: 0, count: 0 };
                dailyMap[item.closed].total += parseFloat(item.pnl) || 0;
                dailyMap[item.closed].count += 1;
            });

            Object.keys(dailyMap).forEach(date => {
                const sum = dailyMap[date];
                const isProf = sum.total >= 0;
                const isSel = selectedFilterDate === date;
                const div = document.createElement('div');
                div.className = `p-3 rounded-xl border cursor-pointer flex justify-between items-center ${isSel ? 'bg-indigo-500/10 border-indigo-500 text-white font-bold' : 'bg-[#090a10] border-[#23273c] text-slate-200'}`;
                div.onclick = () => filterByDate(isSel ? null : date);
                div.innerHTML = `<div><div class="font-bold text-xs">${date}</div><div class="text-[10px] text-slate-400">${sum.count} trade</div></div><div class="text-right"><div class="num font-bold text-xs ${isProf?'text-emerald-400':'text-rose-400'}">${isProf?'+':''}${sum.total.toFixed(2)} USDT</div><div class="num text-[10px] text-slate-400">${formatRupiah(sum.total*currentKursIdr)}</div></div>`;
                dailyC.appendChild(div);
            });

            let filtered = data;
            if (selectedFilterDate) {
                filtered = data.filter(i => i.closed === selectedFilterDate);
                document.getElementById('listHeaderTitle').innerText = `Trade: ${selectedFilterDate}`;
                document.getElementById('resetFilterBtn').classList.remove('hidden');
            } else {
                document.getElementById('listHeaderTitle').innerText = "Riwayat Trade";
                document.getElementById('resetFilterBtn').classList.add('hidden');
            }

            filtered.forEach(item => {
                const p = parseFloat(item.pnl) || 0;
                const isProf = p >= 0;
                const div = document.createElement('div');
                div.className = `p-3 rounded-xl border ${isProf?'border-emerald-500/20 bg-emerald-500/5':'border-rose-500/20 bg-rose-500/5'} flex justify-between items-center cursor-pointer select-none`;
                div.innerHTML = `<div class="text-left text-xs"><span class="text-indigo-400 font-bold">#${item.no}</span> • <span class="text-slate-300">${item.closed}</span><div class="text-[9px] ${isProf?'text-emerald-500':'text-rose-500'} font-bold">${isProf?'PROFIT':'LOSS'}</div></div><div class="font-bold text-xs text-white">${item.pair}</div><div class="text-right text-xs"><div class="num font-bold ${isProf?'text-emerald-400':'text-rose-400'}">${isProf?'+':''}${p.toFixed(2)} USDT</div><div class="num text-[10px] text-slate-400">${formatRupiah(p*currentKursIdr)}</div></div>`;
                div.onclick = () => handleHapus(item.no);
                tradeC.appendChild(div);
            });
        }

        function renderStats(res) {
            const tot = parseFloat(res.totalPnl) || 0;
            const isProf = tot >= 0;
            document.getElementById('statTotal').textContent = `${isProf?'+':''}${tot.toFixed(2)}`;
            document.getElementById('statTotal').className = `num text-sm font-bold ${isProf?'text-emerald-400':'text-rose-400'}`;
            document.getElementById('statTotalIdr').textContent = formatRupiah(tot * currentKursIdr);
            document.getElementById('statCount').textContent = res.totalTrades || 0;
            document.getElementById('statWinRate').textContent = `${res.winRate || 0}%`;
        }
    </script>
</body>
</html>
